{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>PROSESMT - Portal do Cliente</title>

    <!-- Bootstrap CSS -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Sidebar CSS -->
    <link href="{% static 'css/pages/sidebar.css' %}" rel="stylesheet">

    <!-- Dashboard CSS -->
    <link href="{% static 'css/pages/dashboard.css' %}" rel="stylesheet">

    <!-- Change Info Page CSS -->
    <link href="{% static 'css/pages/change_info.css' %}" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body>
    <!-- Navbar or Sidebar placeholder -->
    {% block sidebar %}
    {% include 'partials/sidebar.html' %}
    {% endblock %}

    <!-- Main Content -->
    <main class="container-fluid" style="padding-top: 20px;">
        {% block content %} {% endblock %}
    </main>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/plug-ins/1.11.5/i18n/pt-BR.json"></script>

    <!-- FontAwesome JS -->
    <script src="https://kit.fontawesome.com/ae360af17e.js" crossorigin="anonymous"></script>

    <!-- Custom Scripts -->
    <script src="{% static 'js/custom.js' %}"></script>
</body>
</html>
