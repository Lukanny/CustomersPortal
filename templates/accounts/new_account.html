{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - PROSESMT</title>

    <!--Bootstrap CSS-->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <!--Custom CSS-->
    <link href="{% static 'css/pages/new_account.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <!-- Botão Voltar -->
        <div class="d-flex justify-content-start mb-3">
            <a href="{% url 'login' %}" class="btn btn-secondary">&larr; Voltar</a>
        </div>

        <!-- Formulário -->
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header text-center bg-primary text-white">
                        <h3>Cadastro de Usuário</h3>
                    </div>
                    <div class="card-body">
                        <form action="{% url 'register' %}" method="POST">
                            {% csrf_token %}
                            
                            <!-- Nome do Representante -->
                            <div class="mb-3">
                                <label for="empregado_nome" class="form-label">Nome do Representante Legal</label>
                                <input type="text" name="empregado_nome" id="empregado_nome" class="form-control" placeholder="Insira o nome" required>
                            </div>

                            <!-- CPF do Representante -->
                            <div class="mb-3">
                                <label for="empregado_cpf" class="form-label">CPF</label>
                                <input type="text" name="empregado_cpf" id="empregado_cpf" class="form-control" placeholder="Insira o CPF" required>
                            </div>

                            <!-- E-mail -->
                            <div class="mb-3">
                                <label for="email_funcionario" class="form-label">E-mail</label>
                                <input type="email" name="email_funcionario" id="email_funcionario" class="form-control" placeholder="Insira o e-mail" required>
                            </div>

                            <!-- Confirmar E-mail -->
                            <div class="mb-3">
                                <label for="email_funcionario2" class="form-label">Confirmar E-mail</label>
                                <input type="email" name="email_funcionario2" id="email_funcionario2" class="form-control" placeholder="Confirme o e-mail" required>
                            </div>

                            <!-- Senha -->
                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <div class="input-group">
                                    <input type="password" name="senha" id="senha" class="form-control" placeholder="Crie uma senha" required>
                                    <button type="button" class="btn btn-outline-secondary" id="toggleSenha">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <small class="form-text text-muted">Sua senha deve ter entre 8-20 caracteres, combinando letras, números e símbolos.</small>
                            </div>

                            <!-- Confirmar Senha -->
                            <div class="mb-3">
                                <label for="senha2" class="form-label">Confirmar Senha</label>
                                <div class="input-group">
                                    <input type="password" name="senha2" id="senha2" class="form-control" placeholder="Confirme a senha" required>
                                    <button type="button" class="btn btn-outline-secondary" id="toggleSenha2">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Botão Concluir Cadastro -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Concluir Cadastro</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--Bootstrap JS-->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <!--FontAwesome JS-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <!--Custom JS-->
    <script>
        // Toggle password visibility
        document.getElementById('toggleSenha').addEventListener('click', function () {
            const senha = document.getElementById('senha');
            const type = senha.type === 'password' ? 'text' : 'password';
            senha.type = type;
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        document.getElementById('toggleSenha2').addEventListener('click', function () {
            const senha2 = document.getElementById('senha2');
            const type = senha2.type === 'password' ? 'text' : 'password';
            senha2.type = type;
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
