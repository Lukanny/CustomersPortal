{% extends "base.html" %}
{% load static %}

{% block title %}
Alterar Informações - PROSESMT
{% endblock %}

{% block styles %}
<!-- CSS específico para o formulário de alterar informações -->
<link href="{% static 'css/pages/change_user_info.css' %}" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container mt-4">
    <!-- Card do Formulário -->
    <div class="card">
        <div class="card-header bg-primary text-white">
            Alterar Informações
        </div>
        <div class="card-body">
            <form action="{% url 'edit' %}" method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="text-end">
                    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Scripts adicionais, se necessários -->
{% endblock %}
